
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaIca | Iniciar sesión</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="login-body">

    <main class="login-page">
        <section class="login-card">

            <div class="login-brand">
                <img
                    src="images/logo-aquaica.png"
                    alt="AquaIca"
                    class="login-logo">

                <div class="login-brand-text">
                    <h1>AquaIca</h1>
                    <span>Sistema de Gestión Municipal</span>
                </div>
            </div>

            <div class="login-header">
                <h2>Iniciar sesión</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <div id="loginMessage" class="login-message" hidden></div>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

                <div class="register-link">
                    <span>¿No tienes una cuenta?</span>
                    <a href="registro.html">Regístrate</a>
                </div>

            </form>

            
<div class="login-divider">
    <span>O continúa con</span>
</div>

<div class="google-login-container">
    <div id="googleSignIn"></div>
</div>

<div id="googleMessage" class="login-message" hidden></div>


            <div id="googleMessage" class="login-message" hidden></div>

            <div class="login-footer">
                <span>AquaIca © 2026</span>
                <span>Sistema de gestión municipal</span>
            </div>

        </section>
    </main>

    <script src="js/auth.js"></script>

    <script>
        window.addEventListener("load", function () {
            if (!window.google || !google.accounts) {
                console.error("No se pudo cargar Google Identity Services.");
                return;
            }

            google.accounts.id.initialize({
                client_id: "782958105473-e0pa8e07gbjfnl4jml0cviekalqa95j9.apps.googleusercontent.com",
                callback: function (response) {
                    if (typeof window.manejarLoginGoogle === "function") {
                        window.manejarLoginGoogle(response.credential);
                    } else {
                        console.error(
                            "Falta implementar manejarLoginGoogle() en js/auth.js"
                        );
                    }
                }
            });

            google.accounts.id.renderButton(
                document.getElementById("googleSignIn"),
                {
                    theme: "outline",
                    size: "large",
                    text: "continue_with",
                    shape: "rectangular",
                    width: 280
                }
            );
        });
    </script>

</body>
</html>
